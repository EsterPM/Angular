<div [formGroup]="form">

  <!--Form conectat amb aquest form les validacions-->
  <address-form legend="Address" formControlName="address"></address-form>

  <!--Crea un camp de formulari amb estil de Material Design.-->
  <mat-form-field>
    <!--matInput aplica l'estil Material.-->
    <input matInput placeholder="Course title" formControlName="title" #title>
    <!--Mostra un contador de caràcters en temps real.-->
    <mat-hint align="end">
      {{ title.value.length }} / 60
    </mat-hint>

    <mat-error>
      @if (courseTitle.errors?.titleExists) {
      This title is already being used.
      }
    </mat-error>
  </mat-form-field>

  <!--selecció desplegable-->
  <mat-form-field>
    <mat-select placeholder="Select category" formControlName="category">
      <ng-container *ngFor="let category of (courseCategories$ | async)">
        <!-- El valor de cada opció serà el category.code, i el que es mostrarà al usuari és el category.description.-->
        <mat-option [value]="category.code">{{category.description}}</mat-option>
      </ng-container>
    </mat-select>
  </mat-form-field>

  <!--Calendari data-->
  <mat-form-field>
    <!--matDatepicker=releaseDatePicker: vincula el <input> al calendari.-->
    <input matInput [matDatepicker]="releaseDatePicker" formControlName="releasedAt" placeholder="Release date">
    <!--mostra una icona que obre el calendari.-->
    <mat-datepicker-toggle matSuffix [for]="releaseDatePicker"></mat-datepicker-toggle>
    <!--defineix el calendari.-->
    <mat-datepicker #releaseDatePicker></mat-datepicker>
  </mat-form-field>

  <!--Checkbox-->
  <mat-checkbox color="primary" formControlName="downloadsAllowed">
    Downloads allowed?
  </mat-checkbox>

  <!--Text area-->
  <mat-form-field appearance="outline">
    <textarea matInput placeholder="Description" formControlName="longDescription">
    </textarea>
  </mat-form-field>
</div>

<div class="form-val">

  {{form.value | json}}

</div>
