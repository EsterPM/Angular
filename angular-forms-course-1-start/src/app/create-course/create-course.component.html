<div class="create-course-panel data-form">

  <h2 class="title">Create New Course</h2>
  <!--mat-horizontal-stepper permet dividir el formulari en passos.-->
  <!--linear=true: obliga a completar cada pas abans d'avançar al següent.-->
  <mat-horizontal-stepper [linear]="true" class="mat-elevation-z5" labelPosition="bottom">

    <!--Representa un pas del formulari.-->
    <!--[stepControl]: indica el FormGroup que s'ha d'omplir correctament per avançar.-->
    <mat-step [stepControl]="step1.form">
      <!--el títol visible del pas-->
      <ng-template matStepLabel>course landing page details</ng-template>

      <!--step1 referència al component CreateCourseStep1Component, que conté un form.-->
      <create-course-step-1 #step1></create-course-step-1>

      <div class="stepper-buttons">
        <!--matStepperNext fa que el botó avanci al següent pas del stepper-->
        <button mat-raised-button color="primary" matStepperNext>
          Continue to Step 2</button>
      </div>
    </mat-step>


    <!--Segon pas del formulari-->
    <mat-step>
      <create-course-step-2></create-course-step-2>

      <ng-template matStepLabel>course pricing details</ng-template>

      <div class="stepper-buttons">
        <button mat-raised-button matStepperPrevious>Back</button>
        <button mat-raised-button color="primary" matStepperNext>
          Continue to Step 3</button>
      </div>
    </mat-step>
  </mat-horizontal-stepper>

</div>
