<div [formGroup]="form">

  <!--agrupa els botons de selecció (mat-radio-button), assegurant que només es pot seleccionar una opció dins del grup.-->
  <mat-radio-group formControlName="courseType">
    <mat-radio-button value="free">Free</mat-radio-button>
    <mat-radio-button value="premium">Premium</mat-radio-button>
  </mat-radio-group>

  <!--Numeros-->
  <mat-form-field>
    <input type="number" matInput placeholder="Price" formControlName="price">
  </mat-form-field>


  <!--selector de rang de dates-->
  <mat-form-field>
    <mat-label>Promotional period</mat-label>

    <mat-date-range-input [rangePicker]="promoPicker">
      <input matStartDate placeholder="Start date" formControlName="promoStartAt">
      <input matEndDate placeholder="End date" formControlName="promoEndAt">
    </mat-date-range-input>

    <!--"dirty" = modificat-->
    <mat-error *ngIf="form.errors?.promoPeriod && form.dirty">
      The start date must be before the end date.</mat-error>

    <!--botó que activa el selector de dates.-->
    <mat-datepicker-toggle matSuffix [for]="promoPicker"></mat-datepicker-toggle>
    <!--és el selector de dates en si mateix, que es vincula al mat-date-range-input-->
    <mat-date-range-picker #promoPicker></mat-date-range-picker>

  </mat-form-field>

</div>


<div class="form-val">

  {{form.value | json}}

</div>
