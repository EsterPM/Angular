<mat-card class="login-page">
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>

    <!--ngSubmit, per formularis complets amb validació-->
    <form class="login-form data-form" #loginForm="ngForm"
          (ngSubmit)="login(loginForm, $event)">

      <mat-form-field>
        <!--ngModel perque ngForm pugui interectuar. #email.... per poder accedir directament al input-->
        <input matInput type="email" name="email"
              ngModel #email="ngModel"
              required minlength="3" email
              placeholder="Email">

        <!--Missatges d'error-->
        <mat-error>
          @if (email.errors?.required) {
            The email is mandatory.
          }
          @else if (email.errors?.minlength) {
            Your email must have minimum...
          }
          @else if (email.errors?.email) {
            This is not a valid email
          }
          </mat-error>

      </mat-form-field>

      <mat-form-field>

        <input matInput type="password" name="password"
               ngModel #password="ngModel"
               required
               placeholder="Password">

      </mat-form-field>

      <!--El boto estará desactivat si els camps no son valids-->
      <button mat-raised-button color="primary" type="submit"
            [disabled]="!loginForm.valid">
        Login
      </button>

    </form>

    <!--Exemple per veure les validacions-->
    <div class="form-val">
      {{ loginForm.valid | json }}
      {{ email.valid + ' ' + password.valid}}
    </div>

  </mat-card-content>
</mat-card>
