<div class="courses-panel">

  <h3>All Courses</h3>

  <button class="btn">
    Add Course
  </button>

  <mat-tab-group>

    <mat-tab label="Beginners">
      <!--Perque es vegin els canvis al moment.-->
      <courses-card-list [courses]="beginnerCourses()" (courseUpdated)="onCourseUpdated($event)"></courses-card-list>
    </mat-tab>

    <mat-tab label="Advanced">
      <!--passant els computed signals com a inputs.-->
      <courses-card-list [courses]="advancedCourses()" (courseUpdated)="onCourseUpdated($event)"></courses-card-list>
    </mat-tab>

  </mat-tab-group>

</div>
