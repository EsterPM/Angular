<!--comprova si hi ha un missatge actiu.-->
@if(message()) {
  <div class="messages-container">
    <!--afegeixes dinàmicament una classe CSS segons la severitat del missatge (success, error, info...)-->
    <div class="message" [ngClass]="message()?.severity">
      {{message()?.text}}
      <img class="close" src="/assets/icons/close.svg"
           (click)="onClose()">
    </div>
  </div>
}
