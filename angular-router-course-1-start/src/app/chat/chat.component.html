<div class="chat-container mat-elevation-z7">

  <h2>How can we help you?</h2>

  <textarea placeholder="Type Your Message Here"></textarea>

  <div class="buttons-container">

    <button mat-raised-button color="primary">Send Message</button>

    <!--Per tancar el chat, però et queda chat en la url. No es la manera de fer servir un chat com a ruta secundaria-->
    <!--Es fa amb angular material-->
    <button mat-raised-button
        [routerLink]="['../', {outlets: {chat: null}}]">
      Close Chat</button>

  </div>

</div>
