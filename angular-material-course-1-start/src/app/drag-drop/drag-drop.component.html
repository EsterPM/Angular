<!--Agrupa múltiples llistes (cdkDropList), permetent intercanvi d'elements entre elles.-->
<div class="drag-drop-container" cdkDropListGroup>
  <!--Llista de lliçons pendents-->
  <div class="pending">
    <h3>Lessons To Watch:</h3>
    <!--Quan es deixa anar un element, es dispara dropMultiList($event)-->
    <div cdkDropList class="lessons-list drag-drop-list" [cdkDropListData]="lessons"
      (cdkDropListDropped)="dropMultiList($event)">

      <!--Cada lliçó es pot arrossegar (cdkDrag)-->
      <div class="lesson drag-drop-item" *ngFor="let lesson of lessons" cdkDrag>
        <!--*cdkDragPlaceholder mostra un espai visual durant l'arrossegament-->
        <div class="drop-placeholder" *cdkDragPlaceholder></div>
        {{lesson.description}}
      </div>
    </div>
  </div>

  <!--Llista de lliçons completades-->
  <div class="done">
    <h3>Done:</h3>
    <div cdkDropList class="lessons-list drag-drop-list" [cdkDropListData]="done"
      (cdkDropListDropped)="dropMultiList($event)">

      <div class="lesson drag-drop-item" *ngFor="let lesson of done" cdkDrag>
        <div class="drop-placeholder" *cdkDragPlaceholder></div>
        {{lesson.description}}
      </div>
    </div>
  </div>
</div>
